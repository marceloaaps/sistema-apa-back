services:
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres:
    image: postgres:15
    container_name: apa_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      -
  redis:
    image: redis:7
    ports:
      - "6379:6379"


  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apa_api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}  # Sobrescreve o URL de conexão para apontar ao container postgres

volumes:
  pgdata:
